<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="./src/style.css" rel="stylesheet">
    <script type="module" src="/src/main.js"></script>
</head>
<body x-data="{resp:'', dev:false}" class="bg-orange-50">
    <!-- 
    <div>
        
        
    </div>
    -->
    <div id="main" class="mx-auto mt-10 flex flex-col items-center gap-3 ">
        
        <div class="flex bg-orange-100 rounded-full p-2 px-4 gap-3">
            <button class="flex items-center gap-2 bg-white rounded-full px-4 py-2 cursor-pointer">& Home</button>
            <button class="flex items-center gap-2  rounded-full px-4 py-2 cursor-pointer">$ Send</button>
            <button class="text-red-800 cursor-pointer px-4 py-2" onclick="logout()">➜] Logout</button>
        </div>

        <div class="text-center mt-10"> 
            <h2 class="text-2xl mb-0.5">@<span x-text="$store.user.name"></span></h2>
            <p class="text-4xl"><span x-text="$store.balance.amount"></span> Breadcoin</p>
        </div>

        <div class="mt-30 rounded-4xl w-200 h-100 bg-orange-100 p-6">
            <h2 class="text-center mb-4 w-full">Transaction history</h2>


        </div>

    </div>

    <script>
        if (localStorage.getItem('authtoken') == null) {
                window.location.href = "/login";
        }
        function logout() {
            localStorage.clear()
            window.location.href = "/login"
        }
    </script>

</body>
</html>
