<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="./src/style.css" rel="stylesheet">
    <script type="module" src="/src/main.js"></script>
</head>
<body x-data="{resp:'', dev:false}" class="flex">
    <div>
        <div class="w-40 flex flex-col items-center  mr-5 mt-12">
            <button class="bg-gray-600 text-white w-25 py-1 rounded hover:bg-gray-700 mb-4 cursor-pointer">Home</button>
            <button class="bg-gray-700 text-white w-25 py-1 rounded hover:bg-gray-700 mb-4 cursor-not-allowed" disabled>Send Coin</button>
            <button class="bg-gray-600 text-white w-25 py-1 rounded hover:bg-gray-700 mb-4 cursor-pointer" x-on:click="dev = !dev">Developer</button>
            <button class="bg-gray-600 text-white w-25 py-1 rounded hover:bg-gray-700 mb-4 cursor-pointer" onclick="logout()">Logout</button>

            <button class="bg-red-800 text-white w-25 py-1 rounded hover:bg-red-900 mb-4 cursor-pointer" x-show="dev" x-on:click="(async () => {
                    const res = await fetch('https://api.breadfriend.org/dev/read')
                    const data = await res.json()
                    resp = JSON.stringify(data)
                })()">/dev/read
            </button>
        </div>
    </div>
    <div id="main" class="mt-10">
        <h1 class="text-4xl mb-0.5">Hello</h1>
        <p>good to see you, <span x-text="$store.user.name"></span></p>
        <p class="text-3xl mt-4"><span x-text="$store.balance.amount"></span> Breadcoin</p>

        <p class="text-3xl mt-4"><span x-text="resp" x-show="dev"></span></p>
    </div>

    <script>
        if (localStorage.getItem('authtoken') == null) {
                alert("NOT logged in. going to login")
                window.location.href = "/login";
        }
        function logout() {
            localStorage.clear()
            window.location.href = "/login"
        }
    </script>

</body>
</html>
